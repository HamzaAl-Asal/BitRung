# Local development stack: the app's Postgres plus a self-hosted Judge0 CE.
# Run from the repo root: docker compose -f infra/docker-compose.yml up -d
services:
  app-db:
    image: postgres:16.2
    environment:
      POSTGRES_USER: bitrung
      POSTGRES_PASSWORD: bitrung
      POSTGRES_DB: bitrung
    ports:
      - "5433:5432"
    volumes:
      - app-db-data:/var/lib/postgresql/data/
    restart: unless-stopped

  judge0-server:
    image: judge0/judge0:1.13.1
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    ports:
      - "2358:2358"
    privileged: true
    restart: unless-stopped
    depends_on: [judge0-db, judge0-redis]

  judge0-workers:
    image: judge0/judge0:1.13.1
    command: ["./scripts/workers"]
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    privileged: true
    restart: unless-stopped
    depends_on: [judge0-db, judge0-redis]

  judge0-db:
    image: postgres:16.2
    env_file: judge0.conf
    volumes:
      - judge0-db-data:/var/lib/postgresql/data/
    restart: unless-stopped

  judge0-redis:
    image: redis:7.2.4
    command: ["bash", "-c", 'docker-entrypoint.sh --appendonly no --requirepass "$$REDIS_PASSWORD"']
    env_file: judge0.conf
    restart: unless-stopped

volumes:
  app-db-data:
  judge0-db-data:
